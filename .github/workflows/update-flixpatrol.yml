name: Update FlixPatrol Top 10

on:
  schedule:
    - cron: "30 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-flixpatrol
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Scrapling and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install "scrapling[fetchers]==0.5.1"
          scrapling install

      - name: Fetch daily charts
        env:
          FLIXPATROL_DELAY: "1.0"
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/update_flixpatrol.py

      - name: Commit updated data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/flixpatrol
          git diff --staged --quiet && exit 0
          git commit -m "chore: update FlixPatrol daily charts"
          git pull --rebase origin main
          git push
