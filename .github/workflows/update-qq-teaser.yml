name: 📺 Update 爱优腾哔看点

on:
  schedule:
    # 每天北京时间 11:30 自动更新一次
    # cron 使用 UTC 时间（北京时间减去 8 小时）
    - cron: '30 3 * * *'
  workflow_dispatch: # 允许在 GitHub 网页手动运行

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 🚀 运行爱优腾哔抓取脚本（哔哩哔哩仅国创）
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python scripts/update_qq_teaser.py

      - name: 📤 提交并推送到 GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/qq-teaser.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: 自动更新爱优腾哔看点 📺" && git push)
